server:
  port: 5173

app:
  key: ${APP_KEY}
  aimodel: gemini-3.1-flash-lite


spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/uce_chat
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  docker:
    compose:
      enabled: false
      file: docker-compose.yml
  ai:
    model:
      embedding: transformers
    embedding:
      transformer:
        onnx:
          model-uri: classpath:models/model.onnx
        tokenizer:
          uri: classpath:models/tokenizer.json
    vectorstore:
      qdrant:
        collection-name: springrag
        initialize-schema: true

    google:
      genai:
        api-key: ${app.key}
        chat:
          enabled: true
          options:
            model: ${app.aimodel}


logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
